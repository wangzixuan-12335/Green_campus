# ═══════════════════════════════════════════════
# 绿动校园 · Nginx 配置
# 将此文件复制到 /etc/nginx/sites-available/ 并创建软链接到 sites-enabled/
# ═══════════════════════════════════════════════

# 后端 API 上游（Gunicorn）
upstream green_campus_backend {
    server 127.0.0.1:8000;
}

server {
    listen 80;
    # ─── 修改为你的域名或IP ───
    server_name _;

    # 字符集
    charset utf-8;

    # 上传文件大小限制
    client_max_body_size 10M;

    # ─── 前端静态页面 ───
    # 将 frontend 目录内容复制到 /opt/green-campus/frontend/
    root /opt/green-campus/frontend;
    index index.html;

    # ─── API 反向代理 ───
    location /api/ {
        proxy_pass http://green_campus_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    # ─── Django Admin ───
    location /admin/ {
        proxy_pass http://green_campus_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ─── Django 静态文件 ───
    location /static/ {
        alias /opt/green-campus/backend/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # ─── 前端路由（SPA 回退到 index.html）───
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ─── 安全头 ───
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # ─── 日志 ───
    access_log /var/log/nginx/green_campus_access.log;
    error_log  /var/log/nginx/green_campus_error.log;
}
